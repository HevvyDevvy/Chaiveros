name: Release — Chaveiros (Electron App)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ═══════════════════════════════════════════════════════════════════════
  # LINUX — pull kernel artifact, build + package Electron app
  # ═══════════════════════════════════════════════════════════════════════
  release-linux:
    name: 🐧 Release — Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpcap-dev libusb-1.0-0-dev \
            rpm fakeroot

      - name: Download Linux kernel artifact from build workflow
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          name: kernel-linux
          path: app/resources/kernel/linux/
          branch: main
          if_no_artifact_found: warn

      - name: Confirm kernel resources
        run: ls -lh app/resources/kernel/linux/ || echo "⚠ No kernel artifact — continuing without"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install + rebuild
        working-directory: app
        run: |
          npm install --ignore-scripts
          npx electron-rebuild -f -w frida,pcap

      - name: Build + package
        working-directory: app
        run: |
          npm run build
          npx electron-builder --linux AppImage deb --x64 --arm64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            app/dist/*.AppImage
            app/dist/*.deb

  # ═══════════════════════════════════════════════════════════════════════
  # macOS — pull kernel artifact, build + package Electron app
  # ═══════════════════════════════════════════════════════════════════════
  release-macos:
    name: 🍎 Release — macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: brew install libusb || true

      - name: Download macOS kernel artifact from build workflow
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          name: kernel-macos
          path: app/resources/kernel/macos/
          branch: main
          if_no_artifact_found: warn

      - name: Confirm kernel resources
        run: ls -lh app/resources/kernel/macos/ || echo "⚠ No kernel artifact — continuing without"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python setuptools
        run: pip3 install setuptools --break-system-packages

      - name: Install + rebuild
        working-directory: app
        run: |
          npm install --ignore-scripts
          npx electron-rebuild -f -w frida,pcap

      - name: Build + package
        working-directory: app
        run: |
          npm run build
          npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          GH_TOKEN:                         ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY:      ${{ secrets.CSC_LINK != '' }}
          CSC_LINK:                         ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:                 ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID:                         ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD:      ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID:                    ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: app/dist/*.dmg

  # ═══════════════════════════════════════════════════════════════════════
  # WINDOWS — pull kernel artifact, build + package Electron app
  # ═══════════════════════════════════════════════════════════════════════
  release-windows:
    name: 🪟 Release — Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows kernel artifact from build workflow
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build.yml
          name: kernel-windows
          path: app/resources/kernel/windows/
          branch: main
          if_no_artifact_found: warn

      - name: Confirm kernel resources
        shell: pwsh
        run: |
          if (Test-Path app\resources\kernel\windows\) {
            Get-ChildItem app\resources\kernel\windows\
          } else {
            Write-Host "⚠ No kernel artifact — continuing without"
          }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath C:\npcap-sdk
          echo "NPCAP_SDK=C:\npcap-sdk"              >> $env:GITHUB_ENV
          echo "LIB=C:\npcap-sdk\Lib\x64;$env:LIB"  >> $env:GITHUB_ENV
          echo "INCLUDE=C:\npcap-sdk\Include;$env:INCLUDE" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install + rebuild
        working-directory: app
        run: |
          npm install --ignore-scripts
          npx electron-rebuild -f -w frida

      - name: Swap pcap for cap (Windows-compatible packet capture)
        working-directory: app
        shell: pwsh
        run: |
          (Get-Content package.json) -replace '"pcap"', '"cap"' | Set-Content package.json
          npm install cap --ignore-scripts

      - name: Build + package
        working-directory: app
        run: |
          npm run build
          npx electron-builder --win nsis portable --x64 --publish never
        env:
          GH_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            app/dist/*Setup*.exe
            app/dist/*Portable*.exe

  # ═══════════════════════════════════════════════════════════════════════
  # PUBLISH — create GitHub Release with all three platform installers
  # ═══════════════════════════════════════════════════════════════════════
  publish:
    name: 📦 Publish GitHub Release
    needs: [release-linux, release-macos, release-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artefacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: List assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🛡 Chaveiros — Ransomware Defense ${{ github.ref_name }}"
          body: |
            ## 🛡 Chaveiros — Ransomware Defense ${{ github.ref_name }}

            > ⚠️ **Authorised use only.** Deploy only on systems you own or have
            > explicit written permission to monitor.

            ### Downloads
            | Platform | File | Notes |
            |---|---|---|
            | 🐧 Linux | `.AppImage` · `.deb` | Run with `sudo` for full capabilities |
            | 🍎 macOS | `.dmg` | Right-click → Open on first launch |
            | 🪟 Windows | `*Setup.exe` · `*Portable.exe` | Run as Administrator + install [Npcap](https://npcap.com) |

            ### First run
            1. Run as Administrator / sudo
            2. **Settings** → set log passphrase
            3. **Dashboard** → ▶ Start Scanning
          files: release-assets/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
