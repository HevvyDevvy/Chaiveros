name: Build — Chaveiros (Kernel + Electron)

# Runs on every push to main/dev and on PRs
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # LINUX
  # Compiles encryption_scanner.ko then packages Electron AppImage + deb
  # ═══════════════════════════════════════════════════════════════════════
  build-linux:
    name: 🐧 Linux — Kernel + Electron
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 1. Kernel module ─────────────────────────────────────────────
      - name: Install kernel build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            linux-headers-$(uname -r) \
            build-essential gcc make \
            libpcap-dev libusb-1.0-0-dev

      - name: Compile Linux kernel module
        run: |
          # Rename source to match module name expected by Makefile
          cp Linux-Kernel-Scanner.c encryption_scanner.c

          # Inline Makefile for CI (no separate Makefile needed in runner)
          cat > Makefile.ci << 'EOF'
          obj-m += encryption_scanner.o
          KDIR := /lib/modules/$(shell uname -r)/build
          PWD  := $(shell pwd)
          all:
          	$(MAKE) -C $(KDIR) M=$(PWD) modules
          clean:
          	$(MAKE) -C $(KDIR) M=$(PWD) clean
          EOF

          make -f Makefile.ci all 2>&1
          ls -lh encryption_scanner.ko || echo "⚠ Module build failed — check output above"

      - name: Stage kernel module into Electron resources
        run: |
          mkdir -p app/resources/kernel/linux
          if [ -f encryption_scanner.ko ]; then
            cp encryption_scanner.ko app/resources/kernel/linux/
            echo "✓ encryption_scanner.ko staged"
          else
            echo "⚠ No .ko found — kernel module unavailable in this build"
          fi
          # Always include the source so users can recompile against their kernel
          cp Linux-Kernel-Scanner.c app/resources/kernel/linux/

      # ── 2. Electron app ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm dependencies
        working-directory: app
        run: npm ci

      - name: Rebuild native modules for Electron (frida, cap)
        working-directory: app
        run: npx electron-rebuild -f -w frida,cap

      - name: Build (Vite + esbuild)
        working-directory: app
        run: npm run build

      - name: Package — AppImage + deb
        working-directory: app
        run: npx electron-builder --linux AppImage deb --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artefacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # macOS
  # Compiles Mac-Kernel-Scanner.m (legacy kext) then packages DMG
  # NOTE: macOS 11+ deprecated kexts. Compile step produces a reference
  # build and includes source. Full DriverKit port is a future milestone.
  # ═══════════════════════════════════════════════════════════════════════
  build-macos:
    name: 🍎 macOS — Kernel + Electron
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 1. Kernel scanner (legacy kext reference build) ──────────────
      - name: Install build deps
        run: brew install libusb || true

      - name: Compile macOS kernel scanner
        run: |
          # Attempt legacy kext compile — will warn on macOS 11+
          # This produces a reference binary; full kext loading requires SIP off
          clang -Wall -Wextra \
            -framework CoreFoundation \
            -framework IOKit \
            -o mac_kernel_scanner Mac-Kernel-Scanner.m \
            2>&1 || echo "⚠ kext compile warnings (expected on macOS 11+) — see docs/macos-compat.md"

      - name: Stage macOS scanner into Electron resources
        run: |
          mkdir -p app/resources/kernel/macos
          [ -f mac_kernel_scanner ] && cp mac_kernel_scanner app/resources/kernel/macos/
          # Always include source for local recompile / DriverKit port
          cp Mac-Kernel-Scanner.m app/resources/kernel/macos/
          echo "Contents of macos kernel resource dir:"
          ls -lh app/resources/kernel/macos/

      # ── 2. Electron app ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm dependencies
        working-directory: app
        run: npm ci

      - name: Rebuild native modules for Electron
        working-directory: app
        run: npx electron-rebuild -f -w frida,cap

      - name: Build
        working-directory: app
        run: npm run build

      - name: Package — DMG (unsigned in CI)
        working-directory: app
        run: npx electron-builder --mac dmg --x64 --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artefacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: app/dist/*.dmg
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # Windows
  # Compiles Windows-Kernel-Scanner.cpp (syntax + MSVC check) then
  # packages NSIS installer.
  # NOTE: Full WDK .sys compilation requires the Windows Driver Kit which
  # is not available on standard GitHub runners. The workflow validates
  # C++ syntax with MSVC and bundles the source. Attestation signing via
  # Microsoft Partner Center is a manual step — see docs/windows-signing.md
  # ═══════════════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Windows — Kernel + Electron
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 1. Npcap SDK (required to compile the `cap` npm native module) ─
      - name: Download Npcap SDK
        shell: pwsh
        run: |
          $sdkUrl = "https://npcap.com/dist/npcap-sdk-1.13.zip"
          Invoke-WebRequest $sdkUrl -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath C:\npcap-sdk
          echo "NPCAP_SDK=C:\npcap-sdk" >> $env:GITHUB_ENV
          echo "LIB=C:\npcap-sdk\Lib\x64;$env:LIB" >> $env:GITHUB_ENV
          echo "INCLUDE=C:\npcap-sdk\Include;$env:INCLUDE" >> $env:GITHUB_ENV

      # ── 2. Windows kernel driver (MSVC syntax validation) ────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate driver source (MSVC syntax check)
        shell: cmd
        run: |
          :: Full WDK compilation requires WDK headers not present on runners.
          :: This step validates C++ syntax. The source is bundled for local build.
          cl.exe /nologo /W3 /WX- /O2 /MT /std:c++17 ^
            /D_CONSOLE /DUNICODE /D_UNICODE ^
            Windows-Kernel-Scanner.cpp /Fe:windows_scanner_check.exe ^
            2>&1 || echo "Note: WDK-specific headers unavailable on runner — syntax check only"

      - name: Stage Windows driver source into Electron resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app\resources\kernel\windows | Out-Null
          # Bundle source — users compile locally with WDK or use attestation-signed build
          Copy-Item Windows-Kernel-Scanner.cpp app\resources\kernel\windows\
          # Copy syntax-check exe if it built successfully
          if (Test-Path windows_scanner_check.exe) {
            Copy-Item windows_scanner_check.exe app\resources\kernel\windows\
          }
          Get-ChildItem app\resources\kernel\windows\

      # ── 3. Electron app ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install npm dependencies
        working-directory: app
        run: npm ci

      - name: Rebuild native modules for Electron
        working-directory: app
        run: npx electron-rebuild -f -w frida,cap

      - name: Build
        working-directory: app
        run: npm run build

      - name: Package — NSIS installer (signed if cert secrets present)
        working-directory: app
        shell: pwsh
        run: npx electron-builder --win nsis --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload Windows artefacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            app/dist/*Setup*.exe
            app/dist/*Portable*.exe
          retention-days: 7
