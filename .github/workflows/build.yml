name: Build — Chaveiros (Kernel Modules)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:

  # ═══════════════════════════════════════════════════════════════════════
  # LINUX — compile encryption_scanner.ko
  # ═══════════════════════════════════════════════════════════════════════
  build-linux-kernel:
    name: 🐧 Linux — Kernel Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kernel build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            linux-headers-$(uname -r) \
            build-essential gcc make

      - name: Compile Linux kernel module
        run: |
          cp Linux-Kernel-Scanner.c encryption_scanner.c
          printf 'obj-m += encryption_scanner.o\nKDIR := /lib/modules/$(shell uname -r)/build\nPWD  := $(shell pwd)\nall:\n\t$(MAKE) -C $(KDIR) M=$(PWD) modules\nclean:\n\t$(MAKE) -C $(KDIR) M=$(PWD) clean\n' > Makefile.ci
          make -f Makefile.ci all 2>&1 || true
          ls -lh encryption_scanner.ko 2>/dev/null && echo "✓ Module built" || echo "⚠ Build failed — source only"

      - name: Stage kernel artifact
        run: |
          mkdir -p kernel-out/linux
          [ -f encryption_scanner.ko ] && cp encryption_scanner.ko kernel-out/linux/ || true
          cp Linux-Kernel-Scanner.c kernel-out/linux/
          echo "Runner kernel: $(uname -r)" > kernel-out/linux/BUILD_INFO.txt
          echo "Built: $(date -u)"          >> kernel-out/linux/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-linux
          path: kernel-out/linux/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # macOS — compile mac_kernel_scanner
  # ═══════════════════════════════════════════════════════════════════════
  build-macos-kernel:
    name: 🍎 macOS — Kernel Scanner
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile macOS scanner
        run: |
          clang -Wall -framework CoreFoundation -framework IOKit \
            -o mac_kernel_scanner Mac-Kernel-Scanner.m 2>&1 || true

      - name: Stage kernel artifact
        run: |
          mkdir -p kernel-out/macos
          [ -f mac_kernel_scanner ] && cp mac_kernel_scanner kernel-out/macos/ || true
          cp Mac-Kernel-Scanner.m kernel-out/macos/
          sw_vers > kernel-out/macos/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-macos
          path: kernel-out/macos/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # WINDOWS — compile ChaiverosScanner.sys via WDK
  # ═══════════════════════════════════════════════════════════════════════
  build-windows-kernel:
    name: 🪟 Windows — Kernel Driver
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,19.0)'

      - name: Install Windows Driver Kit
        run: choco install windowsdriverkit11 --yes --no-progress
        timeout-minutes: 30

      - name: Locate WDK and compile kernel driver
        shell: pwsh
        continue-on-error: true
        run: |
          $wdkBase = "C:\Program Files (x86)\Windows Kits\10"
          # Don't just grab the highest version number — the Visual Studio-bundled
          # SDK folder (e.g. 26100) sorts higher than the WDK's own SDK folder
          # (e.g. 22000) but has no km\ headers at all. Pick whichever version
          # folder actually contains ntddk.h.
          $wdkVer = Get-ChildItem "$wdkBase\Include" | Where-Object {
            $_.Name -match '^\d+' -and (Test-Path (Join-Path $_.FullName 'km\ntddk.h'))
          } | Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty Name

          if (-not $wdkVer) {
            Write-Host "⚠ No SDK version folder with km\ntddk.h found under $wdkBase\Include — listing what's there:"
            Get-ChildItem "$wdkBase\Include" | ForEach-Object {
              Write-Host "  $($_.Name) — km present: $(Test-Path (Join-Path $_.FullName 'km'))"
            }
            exit 0
          }

          $wdkInc  = "$wdkBase\Include\$wdkVer"
          $wdkLib  = "$wdkBase\Lib\$wdkVer"
          Write-Host "WDK: $wdkVer — ntddk.h exists: $(Test-Path $wdkInc\km\ntddk.h)"

          & cl.exe /nologo /W4 /WX- /O2 /GS- /kernel /TP `
            /I "$wdkInc\km" /I "$wdkInc\shared" /I "$wdkInc\ucrt" `
            /D NDEBUG /D _AMD64_=1 /D AMD64 /D _WIN64 `
            /D _WIN32_WINNT=0x0A00 /D WINVER=0x0A00 /D WINNT=1 `
            /D POOL_NX_OPTIN=1 `
            Windows-Kernel-Scanner.cpp /Fo:ChaiverosScanner.obj

          if (Test-Path ChaiverosScanner.obj) {
            & link.exe /NOLOGO /DRIVER /WX- /ALIGN:0x80 /NODEFAULTLIB `
              /SUBSYSTEM:NATIVE,10.00 /MACHINE:X64 /KERNEL `
              /PDB:ChaiverosScanner.pdb /OUT:ChaiverosScanner.sys `
              /LIBPATH:"$wdkLib\km\x64" `
              ntoskrnl.lib hal.lib wmilib.lib ChaiverosScanner.obj
          }


      - name: Package driver for Microsoft Partner Center submission
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Test-Path ChaiverosScanner.sys)) {
            Write-Host "⚠ No .sys — skipping CAB packaging"
            exit 0
          }
          # Copy INF alongside the driver
          Copy-Item ChaiverosScanner.inf . -ErrorAction SilentlyContinue
          
          # Generate security catalog
          & inf2cat /driver:. /os:10_x64,Server10_x64 /verbose
          
          # Sign the catalog and .sys with EV cert (uses WIN_CSC_LINK secret)
          # This is done by electron-builder for the app — here we sign manually
          
          # Create .cab for Partner Center attestation submission
          New-Item -ItemType Directory -Force -Path cab-submission | Out-Null
          Copy-Item ChaiverosScanner.sys  cab-submission\
          Copy-Item ChaiverosScanner.inf  cab-submission\
          if (Test-Path ChaiverosScanner.cat) {
            Copy-Item ChaiverosScanner.cat cab-submission\
          }
          
          # Build the .cab
          $cabDdf = @"
          .OPTION EXPLICIT
          .Set CabinetNameTemplate=ChaiverosScanner_PartnerCenter.cab
          .Set DiskDirectoryTemplate=.
          .Set CompressionType=MSZIP
          .Set UniqueFiles=ON
          .Set Cabinet=ON
          .Set DiskLabel1=Chaveiros Driver Submission
          cab-submission\ChaiverosScanner.sys
          cab-submission\ChaiverosScanner.inf
          "@
          if (Test-Path ChaiverosScanner.cat) { $cabDdf += "`ncab-submission\ChaiverosScanner.cat" }
          $cabDdf | Out-File -Encoding ASCII submission.ddf
          & makecab /F submission.ddf
          
          if (Test-Path ChaiverosScanner_PartnerCenter.cab) {
            Copy-Item ChaiverosScanner_PartnerCenter.cab kernel-out\windows\
            Write-Host "✓ CAB ready for Partner Center attestation submission"
          }
          
      - name: Stage kernel artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path kernel-out\windows | Out-Null
          Copy-Item Windows-Kernel-Scanner.cpp kernel-out\windows\
          Copy-Item ChaiverosScanner.vcxproj kernel-out\windows\
          if (Test-Path ChaiverosScanner.sys) {
            Copy-Item ChaiverosScanner.sys kernel-out\windows\
            "✓ .sys built" | Out-File kernel-out\windows\BUILD_INFO.txt
          } else {
            "⚠ .sys not built — WDK source included for local compile" | Out-File kernel-out\windows\BUILD_INFO.txt
            "See docs/windows-signing.md" | Out-File -Append kernel-out\windows\BUILD_INFO.txt
          }
          "Built: $(Get-Date -Format u)" | Out-File -Append kernel-out\windows\BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-windows
          path: kernel-out\windows\
          retention-days: 7
