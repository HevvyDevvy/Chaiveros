name: Build — Chaveiros (Kernel + Electron)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:

  # ═══════════════════════════════════════════════════════════════════════
  # LINUX
  # ═══════════════════════════════════════════════════════════════════════
  build-linux:
    name: 🐧 Linux — Kernel + Electron
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install kernel build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            linux-headers-$(uname -r) \
            build-essential gcc make \
            libpcap-dev libusb-1.0-0-dev

      - name: Compile Linux kernel module
        run: |
          cp Linux-Kernel-Scanner.c encryption_scanner.c
          # Use printf to write Makefile with real tabs (heredoc in YAML loses them)
          printf 'obj-m += encryption_scanner.o\nKDIR := /lib/modules/$(shell uname -r)/build\nPWD  := $(shell pwd)\nall:\n\t$(MAKE) -C $(KDIR) M=$(PWD) modules\nclean:\n\t$(MAKE) -C $(KDIR) M=$(PWD) clean\n' > Makefile.ci
          make -f Makefile.ci all 2>&1 || true
          ls -lh encryption_scanner.ko 2>/dev/null && echo "✓ Module built" || echo "⚠ Module build failed — continuing"

      - name: Stage kernel resources
        run: |
          mkdir -p app/resources/kernel/linux
          [ -f encryption_scanner.ko ] && cp encryption_scanner.ko app/resources/kernel/linux/ || true
          cp Linux-Kernel-Scanner.c app/resources/kernel/linux/
          echo "Runner kernel: $(uname -r)" > app/resources/kernel/linux/BUILD_INFO.txt
          echo "Built: $(date -u)"          >> app/resources/kernel/linux/BUILD_INFO.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        working-directory: app
        run: npm install --ignore-scripts

      - name: Rebuild native modules for Electron
        working-directory: app
        run: npx electron-rebuild -f -w frida,pcap

      - name: Build
        working-directory: app
        run: npm run build

      - name: Package — AppImage + deb
        working-directory: app
        run: npx electron-builder --linux AppImage deb --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artefacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # macOS
  # ═══════════════════════════════════════════════════════════════════════
  build-macos:
    name: 🍎 macOS — Kernel + Electron
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: brew install libusb || true

      - name: Compile macOS kernel scanner
        run: |
          clang -Wall -framework CoreFoundation -framework IOKit \
            -o mac_kernel_scanner Mac-Kernel-Scanner.m 2>&1 || true

      - name: Stage macOS kernel resources
        run: |
          mkdir -p app/resources/kernel/macos
          [ -f mac_kernel_scanner ] && cp mac_kernel_scanner app/resources/kernel/macos/ || true
          cp Mac-Kernel-Scanner.m app/resources/kernel/macos/
          sw_vers > app/resources/kernel/macos/BUILD_INFO.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        working-directory: app
        run: npm install --ignore-scripts

      
      - name: Install Python setuptools (required by node-gyp on macOS)
        run: pip3 install setuptools --break-system-packages

      - name: Rebuild native modules for Electron
        working-directory: app
        run: npx electron-rebuild -f -w frida,pcap

      - name: Build
        working-directory: app
        run: npm run build

      - name: Package — DMG
        working-directory: app
        run: npx electron-builder --mac dmg --x64 --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artefacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: app/dist/*.dmg
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # WINDOWS
  # ═══════════════════════════════════════════════════════════════════════
  build-windows:
    name: 🪟 Windows — Kernel + Electron
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath C:\npcap-sdk
          echo "NPCAP_SDK=C:\npcap-sdk"              >> $env:GITHUB_ENV
          echo "LIB=C:\npcap-sdk\Lib\x64;$env:LIB"  >> $env:GITHUB_ENV
          echo "INCLUDE=C:\npcap-sdk\Include;$env:INCLUDE" >> $env:GITHUB_ENV

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Validate driver source
        shell: cmd
        continue-on-error: true
        run: |
          cl.exe /nologo /W3 /O2 /MT /std:c++17 ^
            /D_CONSOLE /DUNICODE /D_UNICODE ^
            Windows-Kernel-Scanner.cpp /Fe:windows_scanner_check.exe 2>&1
          echo Driver source validation complete

      - name: Stage Windows kernel resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app\resources\kernel\windows | Out-Null
          Copy-Item Windows-Kernel-Scanner.cpp app\resources\kernel\windows\
          if (Test-Path windows_scanner_check.exe) {
            Copy-Item windows_scanner_check.exe app\resources\kernel\windows\
          }
          "Built: $(Get-Date -Format u)" | Out-File app\resources\kernel\windows\BUILD_INFO.txt
          "NOTE: Full .sys requires WDK — see docs/windows-signing.md" | Out-File -Append app\resources\kernel\windows\BUILD_INFO.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        working-directory: app
        run: npm install --ignore-scripts

      - name: Rebuild native modules for Electron
        working-directory: app
        run: npx --yes @electron/rebuild -f -w frida

      - name: Build
        working-directory: app
        run: npm run build

      - name: Package — NSIS installer
        working-directory: app
        run: npx electron-builder --win nsis --x64
        env:
          GH_TOKEN:             ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload Windows artefacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: |
            app/dist/*Setup*.exe
            app/dist/*Portable*.exe
          retention-days: 7
